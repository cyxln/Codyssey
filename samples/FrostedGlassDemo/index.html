<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frosted Glass Navbar</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --glass-bg: rgba(170, 201, 129, 0.35);
        --glass-border: rgba(207, 230, 179, 0.55);
        --glass-shadow: rgba(45, 60, 26, 0.25);
        --text: rgba(26, 37, 20, 0.78);
        --glow: rgba(197, 226, 166, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Outfit", "Segoe UI", sans-serif;
        background: #0e120c;
        color: var(--text);
      }

      .hero {
        position: relative;
        width: min(1200px, 92vw);
        min-height: 80vh;
        border-radius: 32px;
        background: center / cover no-repeat url("background/scotpil5.png");
        overflow: hidden;
        display: grid;
        place-items: center;
        box-shadow: 0 30px 90px rgba(10, 14, 7, 0.45);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.32), transparent 55%),
          radial-gradient(circle at 75% 30%, rgba(180, 220, 130, 0.3), transparent 60%),
          linear-gradient(135deg, rgba(24, 32, 18, 0.45), rgba(24, 32, 18, 0.05));
        mix-blend-mode: soft-light;
      }

      .nav-shell {
        position: relative;
        z-index: 1;
        padding: 18px 28px;
        border-radius: 999px;
        background: var(--glass-bg);
        border: 1.5px solid var(--glass-border);
        box-shadow:
          inset 0 0 18px rgba(255, 255, 255, 0.22),
          0 12px 35px var(--glass-shadow),
          0 0 0 1px rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
      }

      .nav-shell::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }

      nav {
        display: flex;
        align-items: center;
        gap: clamp(18px, 4vw, 40px);
        font-weight: 500;
        letter-spacing: 0.02em;
        font-size: clamp(0.95rem, 2vw, 1.05rem);
        text-transform: capitalize;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 999px;
        transition: background 200ms ease, color 200ms ease, box-shadow 200ms ease;
      }

      nav a:hover,
      nav a:focus-visible {
        background: rgba(242, 255, 224, 0.5);
        color: rgba(20, 30, 16, 0.9);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 0 14px var(--glow);
        outline: none;
      }

      .hint {
        position: absolute;
        bottom: 24px;
        right: 28px;
        z-index: 1;
        font-size: 0.85rem;
        color: rgba(247, 255, 239, 0.78);
        text-shadow: 0 2px 8px rgba(19, 26, 12, 0.8);
      }

      @media (max-width: 720px) {
        .hero {
          min-height: 70vh;
        }

        nav {
          flex-wrap: wrap;
          justify-content: center;
          gap: 12px 18px;
        }

        nav a {
          padding: 8px 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="nav-shell" role="presentation">
        <nav aria-label="Primary">
          <a href="#">About</a>
          <a href="#">Our Pillars</a>
          <a href="#">Impact</a>
          <a href="#">Contact us</a>
        </nav>
      </div>
      <div class="hint">Frosted glass navbar preview</div>
    </main>
  </body>
</html>
